<body class="bg-white antialiased text-gray-600">

                <!-- Navigation Links -->

                    <a href="index.html#blog" class="block text-gray-300 hover:text-accent transition">BLOG</a>

            <!-- Sidebar Footer Socials & Copyright -->

                    <a href="https://instagram.com/khushiimakeover_official" target="_blank" class="hover:text-white transition text-sm"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.facebook.com/share/18wh4hPmkN/" target="_blank" class="hover:text-white transition text-sm"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
                <p class="text-[9px] text-gray-500 uppercase tracking-widest">©2026 MAKEUP ARTIST.</p>

        </aside>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden"></div>

        <!-- ==================== MAIN CONTENT AREA ==================== -->
        <main class="flex-1 lg:ml-64 bg-white min-h-screen px-6 md:px-12 lg:px-16 pt-24 lg:pt-16 pb-16 overflow-x-hidden">
            
            <div class="max-w-6xl mx-auto">
                
                <!-- Header Title & Social Icons Section -->
                <div class="flex justify-between items-start mb-8 w-full">
                    <div>
                        <span class="text-accent text-xs font-semibold tracking-[0.25em] uppercase block mb-1">
                            WHAT WE DO

                        <h1 class="font-heading text-3xl md:text-5xl text-black uppercase font-bold tracking-wider">
                            MAKEUP SERVICES
                        </h1>
                        <div class="w-16 h-[2px] bg-accent mt-3"></div>
                    </div>

                    <!-- Top-Right Larger Social Circle Icons -->
                    <div class="flex gap-3 items-center">
                        <a href="https://instagram.com/khushiimakeover_official" target="_blank" class="w-10 h-10 rounded-full bg-gray-100 text-black flex items-center justify-center text-base hover:bg-black hover:text-white transition shadow-sm">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="https://www.facebook.com/share/18wh4hPmkN/" target="_blank" class="w-10 h-10 rounded-full bg-gray-100 text-black flex items-center justify-center text-base hover:bg-black hover:text-white transition shadow-sm">
                            <i class="fa-brands fa-facebook-f"></i>

                    </div>
                </div>

                <!-- Services Slider Container -->
                <div class="relative w-full">
                    
                    <!-- Slider Cards Track -->
                    <div id="servicesSlider" class="flex gap-6 overflow-x-auto snap-x snap-mandatory scroll-smooth no-scrollbar py-2">
                        
                        <!-- Card 1 (Bridal Makeover) -->
                        <div class="snap-start min-w-[100%] md:min-w-[calc(50%-12px)] flex-shrink-0 relative group cursor-pointer overflow-hidden shadow-sm" onclick="openPopup('./public/preety.jpeg', 'Bridal Makeover For Wedding Or Reception')">
                            <div class="w-full h-[500px] bg-gray-100 overflow-hidden">
                                <img src="./public/preety.jpeg" 
                                     onerror="this.onerror=null; this.src='preety.jpeg';" 
                                     alt="Bridal Makeover" 
                                     class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white px-6 py-3 w-[88%] text-center shadow-md">
                                <p class="text-gray-800 font-medium text-sm md:text-base tracking-wide">
                                    Bridal Makeover For Wedding Or Reception
                                </p>
                            </div>
                        </div>

                        <!-- Card 2 (Pre Function) -->
                        <div class="snap-start min-w-[100%] md:min-w-[calc(50%-12px)] flex-shrink-0 relative group cursor-pointer overflow-hidden shadow-sm" onclick="openPopup('./public/d.jpeg', 'Pre Function Engagement Or Sangeet')">
                            <div class="w-full h-[500px] bg-gray-100 overflow-hidden">
                                <img src="./public/d.jpeg" 
                                     onerror="this.onerror=null; this.src='d.jpeg';" 
                                     alt="Pre Function Engagement" 
                                     class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white px-6 py-3 w-[88%] text-center shadow-md">
                                <p class="text-gray-800 font-medium text-sm md:text-base tracking-wide">
                                    Pre Function Engagement Or Sangeet

                            </div>
                        </div>

                        <!-- Card 3 (Sider Makeover) -->
                        <div class="snap-start min-w-[100%] md:min-w-[calc(50%-12px)] flex-shrink-0 relative group cursor-pointer overflow-hidden shadow-sm" onclick="openPopup('./public/sider.jpeg', 'Sider Makeover')">
                            <div class="w-full h-[500px] bg-gray-100 overflow-hidden">
                                <img src="./public/sider.jpeg" 
                                     onerror="this.onerror=null; this.src='sider.jpeg';"

                                     class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500">
                            </div>
                            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white px-6 py-3 w-[88%] text-center shadow-md">
                                <p class="text-gray-800 font-medium text-sm md:text-base tracking-wide">
                                    Sider Makeover
                                </p>
                            </div>
                        </div>

                    </div>

                    <!-- Slider Pink Dots Navigation Indicator -->
                    <div class="flex justify-center items-center gap-3 mt-8">
                        <button onclick="scrollToSlide(0)" id="dot-0" class="w-3 h-3 rounded-full bg-accent transition-all duration-300 focus:outline-none"></button>
                        <button onclick="scrollToSlide(1)" id="dot-1" class="w-3 h-3 rounded-full bg-gray-300 hover:bg-accent transition-all duration-300 focus:outline-none"></button>
                        <button onclick="scrollToSlide(2)" id="dot-2" class="w-3 h-3 rounded-full bg-gray-300 hover:bg-accent transition-all duration-300 focus:outline-none"></button>
                    </div>

            </div>

        </main>

        <!-- Floating WhatsApp Button -->
        <a href="https://wa.me/919870085600?text=I%20would%20like%20to%20inquiry%20about%20your%20makeup%20and%20salon%20services" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-xl z-30 hover:scale-105 transition">

        <!-- Scroll To Top Button -->
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-6 right-20 border border-gray-300 text-gray-400 hover:text-accent hover:border-accent w-10 h-10 rounded-full bg-white flex items-center justify-center text-sm shadow-sm z-30 transition hidden md:flex">

        </button>

    </div>

    <!-- ==================== IMAGE POPUP / LIGHTBOX MODAL ==================== -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300">
        <!-- Close Button -->
        <button onclick="closePopup()" class="absolute top-5 right-5 text-white text-3xl hover:text-accent transition z-50">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Popup Box Container -->
        <div class="relative max-w-3xl w-full bg-white rounded-sm overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modalContainer" onclick="event.stopPropagation()">
            <img id="popupImage" src="" alt="Popup View" class="w-full max-h-[75vh] object-contain bg-black">
            <div class="p-4 text-center bg-white border-t">
                <p id="popupCaption" class="text-gray-800 font-medium text-base md:text-lg"></p>
            </div>
        </div>
    </div>

    <!-- Interactive Scripts -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Popup Functions
        function openPopup(imageSrc, captionText) {
            const modal = document.getElementById('imageModal');
            const popupImage = document.getElementById('popupImage');
            const popupCaption = document.getElementById('popupCaption');
            const modalContainer = document.getElementById('modalContainer');

            popupImage.src = imageSrc;
            popupCaption.innerText = captionText;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContainer.classList.remove('scale-95');
                modalContainer.classList.add('scale-100');
            }, 10);
        }

        function closePopup() {
            const modal = document.getElementById('imageModal');
            const modalContainer = document.getElementById('modalContainer');

            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('imageModal').addEventListener('click', closePopup);

        // Slider Navigation Script
        const slider = document.getElementById('servicesSlider');
        const dots = [document.getElementById('dot-0'), document.getElementById('dot-1'), document.getElementById('dot-2')];

        function scrollToSlide(index) {
            const cardWidth = slider.children[0].offsetWidth + 24; // width + gap
            slider.scrollTo({
                left: cardWidth * index,
                behavior: 'smooth'
            });
            updateDots(index);
        }

        function updateDots(activeIndex) {
            dots.forEach((dot, idx) => {
                if (idx === activeIndex) {
                    dot.classList.remove('bg-gray-300');
                    dot.classList.add('bg-accent');
                } else {
                    dot.classList.remove('bg-accent');
                    dot.classList.add('bg-gray-300');
                }
            });
        }

        // Auto update active dot on scroll
        slider.addEventListener('scroll', () => {
            const cardWidth = slider.children[0].offsetWidth + 24;
            const activeIndex = Math.round(slider.scrollLeft / cardWidth);
            updateDots(activeIndex);
        });
    </script>
</body>
</html>
