<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Patel | MakeUp Artist</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Colors Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pink-brand': '#ea829b', // Exact Aayushi Patel Pink Accent
                        'dark-bg': '#121212',    // Dark Studio Background
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif, system-ui;
        }
    </style>
</head>
<body class="bg-[#0d0d0d] text-white antialiased overflow-x-hidden">

    <div class="min-h-screen flex flex-col lg:flex-row relative">

        <!-- ==================== 1. LEFT FIXED SIDEBAR ==================== -->
        <aside class="lg:w-64 w-full bg-black border-b lg:border-b-0 lg:border-r border-neutral-900 lg:fixed lg:top-0 lg:left-0 lg:h-screen flex flex-col justify-between p-8 z-40">
            <div>
                <!-- Pink Square Logo (Exact Match) -->
                <a href="index.html" class="inline-block mb-12">
                    <div class="bg-[#ea829b] text-black w-28 h-28 p-3 flex flex-col items-center justify-center text-center shadow-md">
                        <span class="text-3xl font-serif font-extrabold tracking-wider leading-none mb-1">KP</span>
                        <span class="text-[9px] font-bold tracking-widest uppercase leading-tight">KHUSHI PATEL</span>
                        <span class="text-[7px] tracking-widest uppercase mt-0.5 opacity-80">MAKE-UP ARTIST</span>
                    </div>
                </a>

                <!-- Vertical Navigation Links -->
                <nav class="space-y-5 text-xs font-semibold tracking-[0.2em] uppercase">
                    <a href="index.html" class="block text-white hover:text-[#ea829b] transition py-1">HOME</a>
                    <a href="#about" class="block text-gray-400 hover:text-[#ea829b] transition py-1">ABOUT</a>
                    <a href="service.html" class="block text-gray-400 hover:text-[#ea829b] transition py-1">SERVICES</a>
                    <a href="#portfolio" class="block text-gray-400 hover:text-[#ea829b] transition py-1">PORTFOLIO</a>
                    <a href="#blog" class="block text-gray-400 hover:text-[#ea829b] transition py-1">BLOG</a>
                    <a href="#contact" class="block text-gray-400 hover:text-[#ea829b] transition py-1">CONTACT</a>
                </nav>
            </div>

            <!-- Sidebar Bottom Info (Socials & Copyright) -->
            <div class="hidden lg:block pt-6">
                <div class="border-t border-neutral-800 w-10 mb-4"></div>
                <div class="flex gap-4 text-xs text-gray-400 mb-4">
                    <a href="#" class="hover:text-[#ea829b] transition"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="hover:text-[#ea829b] transition"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
                <p class="text-[9px] text-gray-500 uppercase tracking-widest">©2026 MAKEUP ARTIST.</p>
            </div>
        </aside>

        <!-- ==================== 2. MAIN HERO SECTION (RIGHT SIDE) ==================== -->
        <main class="flex-1 lg:ml-64 min-h-screen relative bg-gradient-to-r from-black via-[#111111] to-[#181818] flex items-center">
            
            <div class="w-full max-w-7xl mx-auto px-6 lg:px-16 py-12 grid grid-cols-1 lg:grid-cols-12 items-center gap-8 min-h-screen">
                
                <!-- Hero Left Text Content -->
                <div class="lg:col-span-7 z-10 pt-10 lg:pt-0">
                    
                    <!-- Top Pink Subtitle Line -->
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-[2px] bg-[#ea829b]"></div>
                        <span class="text-[#ea829b] text-xs font-semibold tracking-[0.35em] uppercase">
                            KHUSHI PATEL
                        </span>
                    </div>

                    <!-- Main Huge Bold Title -->
                    <h1 class="text-5xl sm:text-7xl lg:text-8xl font-black text-white tracking-tight uppercase leading-none mb-8">
                        MAKEUP ARTIST
                    </h1>

                    <!-- Pink About Me Button -->
                    <div class="mb-8">
                        <a href="#about" class="inline-block bg-[#ea829b] hover:bg-[#e06d88] text-white font-medium text-xs tracking-wider px-7 py-3.5 transition shadow-lg rounded-sm">
                            About Me
                        </a>
                    </div>

                    <!-- Social Circle Buttons -->
                    <div class="flex items-center gap-3">
                        <a href="#" class="w-9 h-9 rounded-full bg-neutral-900 border border-neutral-800 hover:border-[#ea829b] text-gray-400 hover:text-[#ea829b] flex items-center justify-center text-xs transition">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="#" class="w-9 h-9 rounded-full bg-neutral-900 border border-neutral-800 hover:border-[#ea829b] text-gray-400 hover:text-[#ea829b] flex items-center justify-center text-xs transition">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                    </div>

                </div>

                <!-- Hero Right Model Photo (Seamless Background Fit) -->
                <div class="lg:col-span-5 relative flex justify-end items-end h-full">
                    <div class="relative w-full max-w-md">
                        <!-- Model Image -->
                        <img src="./public/bride.jpeg" 
                             alt="Khushi Patel Makeup Artist" 
                             class="w-full h-auto max-h-[85vh] object-cover rounded-md shadow-2xl filter brightness-95">
                        
                        <!-- Smooth Blend Overlay (Bottom & Left) -->
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0d0d0d] via-transparent to-transparent opacity-80"></div>
                        <div class="absolute inset-0 bg-gradient-to-r from-black/60 via-transparent to-transparent lg:block hidden"></div>
                    </div>
                </div>

            </div>

            <!-- Scroll Down Double Arrow Indicator -->
            <a href="#about" class="absolute bottom-6 left-1/2 lg:left-[55%] -translate-x-1/2 text-gray-400 hover:text-[#ea829b] transition animate-bounce">
                <i class="fa-solid fa-angles-down text-sm"></i>
            </a>

            <!-- Floating WhatsApp Button (Bottom Right) -->
            <a href="https://wa.me/" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] hover:bg-[#20ba5a] text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-2xl z-50 transition transform hover:scale-110">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

        </main>
    </div>

</body>
</html>
