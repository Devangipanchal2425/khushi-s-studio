<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Patel | MakeUp Artist</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* Tall Condensed Font for Heading */
        .font-heading {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
        }

        /* Black Gradient Overlay for Text Readability */
        .hero-gradient {
            background: linear-gradient(to right, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.6) 45%, rgba(10,10,10,0.1) 100%);
        }
    </style>
</head>
<body class="bg-[#0c0c0c] text-white antialiased">

    <!-- ==================== MOBILE HAMBURGER MENU (3 LINES) ==================== -->
    <button onclick="toggleSidebar()" class="lg:hidden fixed top-6 left-6 z-50 text-white bg-black/60 backdrop-blur-sm p-3 rounded-md hover:text-[#ea829b] transition shadow-lg">
        <i class="fa-solid fa-bars text-xl"></i>
    </button>

    <div class="min-h-screen flex relative">

        <!-- ==================== LEFT SIDEBAR ==================== -->
        <aside id="sidebar" class="w-64 bg-[#0a0a0a] border-r border-neutral-900/80 fixed top-0 left-0 h-screen flex flex-col justify-between p-7 z-50 transition-transform duration-300 transform -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none">
            
            <!-- Close Button for Mobile -->
            <button onclick="toggleSidebar()" class="lg:hidden absolute top-6 right-6 text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>

            <div>
                <!-- Pink Square Logo Box -->
                <a href="index.html" class="inline-block mb-10 mt-8 lg:mt-0">
                    <div class="bg-[#ea829b] text-black w-24 h-24 p-2 flex flex-col items-center justify-center text-center shadow-lg">
                        <span class="text-3xl font-serif font-extrabold tracking-wider leading-none mb-1">KP</span>
                        <span class="text-[8px] font-bold tracking-widest uppercase leading-tight">KHUSHI PATEL</span>
                        <span class="text-[6px] tracking-widest uppercase mt-0.5 opacity-80">MAKE-UP ARTIST</span>
                    </div>
                </a>

                <!-- Navigation Links -->
                <nav class="space-y-4 text-[11px] font-semibold tracking-[0.2em] uppercase">
                    <a href="index.html" class="block text-white hover:text-[#ea829b] transition py-1">HOME</a>
                    <a href="#about" class="block text-gray-400 hover:text-[#ea829b] transition py-1">ABOUT</a>
                    <a href="service.html" class="block text-gray-400 hover:text-[#ea829b] transition py-1">SERVICES</a>
                    <a href="#portfolio" class="block text-gray-400 hover:text-[#ea829b] transition py-1">PORTFOLIO</a>
                    <a href="#blog" class="block text-gray-400 hover:text-[#ea829b] transition py-1">BLOG</a>
                    <a href="#contact" class="block text-gray-400 hover:text-[#ea829b] transition py-1">CONTACT</a>
                </nav>
            </div>

            <!-- Sidebar Footer Socials -->
            <div class="pt-6">
                <div class="border-t border-neutral-800/80 w-8 mb-4"></div>
                <div class="flex gap-4 text-xs text-gray-400 mb-3">
                    <a href="https://instagram.com/khushiimakeover_official" target="_blank" class="hover:text-[#ea829b] transition text-base"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.facebook.com/share/18wh4hPmkN/" target="_blank" class="hover:text-[#ea829b] transition text-base"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
                <p class="text-[8px] text-gray-500 uppercase tracking-widest">©2026 MAKEUP ARTIST.</p>
            </div>
        </aside>

        <!-- ==================== MAIN HERO SECTION (FULL SCREEN BG) ==================== -->
        <!-- Background Image set in the style attribute -->
        <main class="flex-1 lg:ml-64 min-h-screen relative bg-cover bg-center bg-no-repeat" style="background-image: url('./public/bride.jpeg');">
            
            <!-- Dark Gradient Fade Overlay (Text readable rahe uske liye) -->
            <div class="absolute inset-0 hero-gradient"></div>
            
            <div class="relative z-10 w-full h-screen flex flex-col justify-center px-8 lg:px-14 pt-16 lg:pt-0">
                
                <!-- Top Pink Subtitle Line -->
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-7 h-[1.5px] bg-[#ea829b]"></div>
                    <span class="text-[#ea829b] text-[11px] font-semibold tracking-[0.35em] uppercase">
                        KHUSHI PATEL
                    </span>
                </div>

                <!-- Main BOLD Title (Strictly 1 Line Using whitespace-nowrap) -->
                <h1 class="font-heading text-5xl sm:text-6xl md:text-7xl lg:text-[80px] xl:text-[95px] text-white uppercase leading-[0.9] mb-8 font-semibold whitespace-nowrap">
                    MAKEUP ARTIST
                </h1>

                <!-- Pink About Me Button -->
                <div class="mb-8">
                    <a href="#about" class="inline-block bg-[#ea829b] hover:bg-[#d97089] text-white font-medium text-xs tracking-wider px-7 py-3 transition shadow-md rounded-sm">
                        About Me
                    </a>
                </div>

                <!-- Social Circle Buttons -->
                <div class="flex items-center gap-3">
                    <a href="https://instagram.com/khushiimakeover_official" target="_blank" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-sm border border-neutral-700 hover:border-[#ea829b] text-gray-300 hover:text-[#ea829b] flex items-center justify-center text-sm transition">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://www.facebook.com/share/18wh4hPmkN/" target="_blank" class="w-9 h-9 rounded-full bg-black/50 backdrop-blur-sm border border-neutral-700 hover:border-[#ea829b] text-gray-300 hover:text-[#ea829b] flex items-center justify-center text-sm transition">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                </div>

            </div>

            <!-- Scroll Down Arrow -->
            <a href="#about" class="absolute bottom-5 left-1/2 -translate-x-1/2 text-gray-400 hover:text-[#ea829b] transition z-10 animate-bounce">
                <i class="fa-solid fa-angles-down text-sm"></i>
            </a>

            <!-- Floating WhatsApp Button -->
            <a href="https://wa.me/" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] hover:bg-[#20ba5a] text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-2xl z-50 transition transform hover:scale-105">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

        </main>
    </div>

    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }
    </script>

</body>
</html>
