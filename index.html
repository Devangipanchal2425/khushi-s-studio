<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Patel | MakeUp Artist</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font: Oswald (For Tall Condensed MAKEUP ARTIST Text) & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        /* Exact Tall Condensed Font for Heading */
        .font-heading {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
        }

        /* Image Mask for Seamless Background Fade */
        .image-blend-fade {
            mask-image: linear-gradient(to right, transparent 0%, black 25%, black 85%, transparent 100%),
                        linear-gradient(to top, transparent 0%, black 20%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%, black 80%, transparent 100%),
                                linear-gradient(to top, transparent 0%, black 15%, black 100%, transparent 100%);
            mask-composite: intersect;
            -webkit-mask-composite: source-in;
        }
    </style>
</head>
<body class="bg-[#0c0c0c] text-white antialiased overflow-x-hidden selection:bg-[#ea829b] selection:text-white">

    <div class="min-h-screen flex flex-col lg:flex-row relative">

        <!-- ==================== 1. LEFT FIXED SIDEBAR ==================== -->
        <aside class="lg:w-60 w-full bg-[#0a0a0a] border-b lg:border-b-0 lg:border-r border-neutral-900/80 lg:fixed lg:top-0 lg:left-0 lg:h-screen flex flex-col justify-between p-7 z-40">
            <div>
                <!-- Pink Square Logo Box -->
                <a href="index.html" class="inline-block mb-10">
                    <div class="bg-[#ea829b] text-black w-24 h-24 p-2 flex flex-col items-center justify-center text-center shadow-lg">
                        <span class="text-3xl font-serif font-extrabold tracking-wider leading-none mb-1">KP</span>
                        <span class="text-[8px] font-bold tracking-widest uppercase leading-tight">KHUSHI PATEL</span>
                        <span class="text-[6px] tracking-widest uppercase mt-0.5 opacity-80">MAKE-UP ARTIST</span>
                    </div>
                </a>

                <!-- Vertical Navigation Links -->
                <nav class="space-y-4 text-[11px] font-semibold tracking-[0.2em] uppercase">
                    <a href="index.html" class="block text-white hover:text-[#ea829b] transition py-1">HOME</a>
                    <a href="#about" class="block text-gray-400 hover:text-[#ea829b] transition py-1">ABOUT</a>
                    <a href="service.html" class="block text-gray-400 hover:text-[#ea829b] transition py-1">SERVICES</a>
                    <a href="#portfolio" class="block text-gray-400 hover:text-[#ea829b] transition py-1">PORTFOLIO</a>
                    <a href="#blog" class="block text-gray-400 hover:text-[#ea829b] transition py-1">BLOG</a>
                    <a href="#contact" class="block text-gray-400 hover:text-[#ea829b] transition py-1">CONTACT</a>
                </nav>
            </div>

            <!-- Sidebar Footer Socials -->
            <div class="hidden lg:block pt-6">
                <div class="border-t border-neutral-800/80 w-8 mb-4"></div>
                <div class="flex gap-4 text-xs text-gray-400 mb-3">
                    <a href="#" class="hover:text-[#ea829b] transition"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="hover:text-[#ea829b] transition"><i class="fa-brands fa-facebook-f"></i></a>
                </div>
                <p class="text-[8px] text-gray-500 uppercase tracking-widest">©2026 MAKEUP ARTIST.</p>
            </div>
        </aside>

        <!-- ==================== 2. MAIN HERO SECTION ==================== -->
        <main class="flex-1 lg:ml-60 min-h-screen relative bg-[#0c0c0c] flex items-center overflow-hidden">
            
            <div class="w-full max-w-7xl mx-auto px-6 lg:px-14 py-10 grid grid-cols-1 lg:grid-cols-12 items-center min-h-screen">
                
                <!-- Hero Left Text Content -->
                <div class="lg:col-span-7 z-20 pt-8 lg:pt-0">
                    
                    <!-- Top Pink Subtitle Line -->
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-7 h-[1.5px] bg-[#ea829b]"></div>
                        <span class="text-[#ea829b] text-[11px] font-semibold tracking-[0.35em] uppercase">
                            KHUSHI PATEL
                        </span>
                    </div>

                    <!-- Main Tall Bold Title (Exact Oswald Condensed Match) -->
                    <h1 class="font-heading text-6xl sm:text-7xl lg:text-[88px] text-white uppercase leading-[0.9] mb-8 font-semibold">
                        MAKEUP ARTIST
                    </h1>

                    <!-- Pink About Me Button -->
                    <div class="mb-8">
                        <a href="#about" class="inline-block bg-[#ea829b] hover:bg-[#d97089] text-white font-medium text-xs tracking-wider px-7 py-3 transition shadow-md rounded-sm">
                            About Me
                        </a>
                    </div>

                    <!-- Social Circle Buttons -->
                    <div class="flex items-center gap-3">
                        <a href="#" class="w-8 h-8 rounded-full bg-[#161616] border border-neutral-800 hover:border-[#ea829b] text-gray-400 hover:text-[#ea829b] flex items-center justify-center text-xs transition">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="#" class="w-8 h-8 rounded-full bg-[#161616] border border-neutral-800 hover:border-[#ea829b] text-gray-400 hover:text-[#ea829b] flex items-center justify-center text-xs transition">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                    </div>

                </div>

                <!-- Hero Right Model Photo (Faded & Seamless Blend) -->
                <div class="lg:col-span-5 relative flex justify-end items-center h-full z-10 -mr-6 lg:-mr-14">
                    <div class="relative w-full max-w-lg lg:max-w-xl">
                        <img src="./public/bride.jpeg" 
                             alt="Khushi Patel Model" 
                             class="w-full h-auto max-h-[88vh] object-cover image-blend-fade opacity-90">
                    </div>
                </div>

            </div>

            <!-- Scroll Down Arrow -->
            <a href="#about" class="absolute bottom-5 left-1/2 lg:left-[52%] -translate-x-1/2 text-gray-400 hover:text-[#ea829b] transition">
                <i class="fa-solid fa-angles-down text-xs"></i>
            </a>

            <!-- Floating WhatsApp Button -->
            <a href="https://wa.me/" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] hover:bg-[#20ba5a] text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-2xl z-50 transition transform hover:scale-105">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

        </main>
    </div>

</body>
</html>
