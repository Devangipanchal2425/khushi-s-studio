<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khushi Patel - Makeup Artist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white font-sans antialiased overflow-x-hidden">

    <!-- Main Hero Section -->
<section class="relative h-screen w-full flex flex-col justify-between p-6 md:p-12 bg-cover bg-center" style="background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('./public/bride.jpeg');">        
        <!-- Top Menu Button -->
        <div class="flex justify-start">
            <button class="w-12 h-12 md:w-14 md:h-14 bg-[#f8a8b8] hover:bg-[#f493a7] rounded-full flex flex-col items-center justify-center gap-1.5 shadow-lg transition duration-300 transform hover:scale-105 cursor-pointer">
                <span class="w-6 h-[2px] bg-gray-900 rounded-full"></span>
                <span class="w-6 h-[2px] bg-gray-900 rounded-full"></span>
                <span class="w-6 h-[2px] bg-gray-900 rounded-full"></span>
            </button>
        </div>

        <!-- Center Content (Name, Title, About Me) -->
        <div class="max-w-2xl my-auto">
            <!-- Small Accent Bar & Name -->
            <div class="flex items-center gap-3 mb-3">
                <span class="w-8 h-[2px] bg-[#f8a8b8]"></span>
                <span class="text-[#f8a8b8] tracking-[0.25em] text-xs md:text-sm font-semibold uppercase">
                    Khushi Patel
                </span>
            </div>

            <!-- Main Heading (Guaranteed Pure White Text) -->
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-serif font-bold tracking-tight leading-tight mb-8" style="color: #ffffff !important; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                MAKEUP ARTIST
            </h1>

            <!-- About Me Button -->
           <a href="about.html" class="inline-block bg-[#f8a8b8] hover:bg-[#f493a7] text-gray-900 font-semibold text-xs md:text-sm px-8 py-3.5 rounded-sm tracking-widest uppercase transition duration-300 shadow-md hover:shadow-lg">
            About Me
            </a>        </div>

        <!-- Bottom Bar: Social Icons (Left) & Floating WhatsApp Button (Right) -->
        <div class="flex items-center justify-between w-full pt-4">
            <!-- Social Media Links -->
            <div class="flex items-center gap-3">
                <!-- Instagram -->
                <a href="https://www.instagram.com/khushiimakeover_official" target="_blank" class="w-10 h-10 md:w-11 md:h-11 rounded-full border border-white/40 bg-black/30 backdrop-blur-sm flex items-center justify-center text-white hover:border-[#f8a8b8] hover:text-[#f8a8b8] transition duration-300">
                    <i class="fa-brands fa-instagram text-lg"></i>
                </a>
                <!-- Facebook -->
                <a href="https://www.facebook.com/share/18wh4hPmkN/" target="_blank" class="w-10 h-10 md:w-11 md:h-11 rounded-full border border-white/40 bg-black/30 backdrop-blur-sm flex items-center justify-center text-white hover:border-[#f8a8b8] hover:text-[#f8a8b8] transition duration-300">
                    <i class="fa-brands fa-facebook-f text-base"></i>
                </a>
            </div>

            <!-- Pre-configured WhatsApp Button -->
            <a href="https://wa.me/919870085600?text=Hello%20Khushi,%20I%20would%20like%20to%20inquire%20about%20your%20bridal%20makeup%20services." 
               target="_blank" 
               class="w-12 h-12 md:w-14 md:h-14 bg-[#25D366] hover:bg-[#20ba5a] text-white rounded-full flex items-center justify-center shadow-2xl transition duration-300 transform hover:scale-110">
                <i class="fa-brands fa-whatsapp text-2xl md:text-3xl"></i>
            </a>
        </div>

    </section>

</body>
</html>
